name: Sync Codeforces Activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Create submissions folder
        run: mkdir -p submissions

      - name: Fetch Codeforces submissions
        run: |
          curl "https://codeforces.com/api/user.status?handle=AnkitaMaji" -o submissions/data.json

      - name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add .

          git commit -m "Update Codeforces submissions" || echo "No changes"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
