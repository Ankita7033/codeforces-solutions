name: Sync Codeforces Activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create submissions folder
        run: mkdir -p submissions

      - name: Fetch Codeforces submissions
        run: |
          curl "https://codeforces.com/api/user.status?handle=AnkitaMaji" \
          -o submissions/data.json

      - name: Commit and push changes
        run: |
          git config user.name "AnkitaMaji"
          git config user.email "ankitamaji7033@gmail.com"

          git add .

          git commit -m "Update Codeforces submissions" || echo "No changes"

          git push
